<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Contact — Les Vendredis du BT Suzini — Étape 3</title>

  <style>
    :root{
      --clay:#c65a1e; --clay-dark:#8e3a13; --clay-light:#ee8a3a;
      --sky:#27bced; --aqua:#00a9c8; --blue:#075b9a; --blue-dark:#063b72;
      --text:#17212b; --muted:#667085; --card:rgba(255,255,255,.94);
      --shadow:0 16px 40px rgba(16,24,40,.12);
      --container:1180px;
    }

    *{box-sizing:border-box;}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(39,188,237,.22), transparent 28%),
        radial-gradient(circle at 85% 10%, rgba(0,169,200,.16), transparent 26%),
        linear-gradient(180deg,#f4fcff 0%,#e9f8ff 48%,#fff 100%);
    }

    a{color:inherit;text-decoration:none;}
    .container{width:min(var(--container), calc(100% - 28px));margin:0 auto;}

    main{
      padding-top:calc(var(--public-total-top, 158px) + 30px);
      padding-bottom:42px;
    }

    .section{margin-top:16px;}

    .panel{
      background:var(--card);
      border:1px solid rgba(255,255,255,.6);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:18px;
    }

    .panel-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:14px;
    }

    .panel-title{
      margin:0;
      font-size:26px;
      line-height:1.05;
      letter-spacing:-.03em;
    }

    .panel-text{
      margin:6px 0 0;
      color:var(--muted);
      font-size:15px;
      line-height:1.35;
    }

    .panel-tag{
      flex-shrink:0;
      padding:8px 13px;
      border-radius:999px;
      background:#e4f7ff;
      color:var(--blue-dark);
      font-size:12px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .contacts{
      display:grid;
      gap:12px;
    }

    .contact-card{
      border-radius:20px;
      padding:15px;
      background:#fff;
      border:1px solid rgba(16,24,40,.08);
      box-shadow:0 8px 18px rgba(16,24,40,.06);
      display:grid;
      gap:11px;
      min-width:0;
    }

    .contact-card.tech{
      background:linear-gradient(135deg,#ffffff,#f0fbff);
      border:1px solid rgba(7,91,154,.14);
    }

    .card-title{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .ico{
      width:42px;
      height:42px;
      border-radius:16px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      background:linear-gradient(135deg,rgba(39,188,237,.18),rgba(198,90,30,.10));
      border:1px solid rgba(39,188,237,.22);
      font-size:22px;
    }

    .who{
      font-weight:1000;
      font-size:18px;
      line-height:1.1;
      color:#1c2430;
    }

    .sub{
      color:var(--blue-dark);
      font-weight:900;
      font-size:12px;
      margin-top:3px;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .value{
      font-size:17px;
      font-weight:1000;
      color:#111;
      word-break:break-word;
    }

    .value.email{
      font-size:16px;
      color:var(--blue-dark);
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }

    .btn-sm{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:10px 13px;
      border-radius:999px;
      border:1px solid rgba(16,24,40,.10);
      background:#fff;
      font-weight:1000;
      color:#111;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:0 6px 14px rgba(16,24,40,.06);
    }

    .btn-sm.primary{
      background:linear-gradient(180deg,var(--blue),var(--blue-dark));
      color:#fff;
      border-color:var(--blue);
    }

    .btn-sm.whatsapp{
      background:linear-gradient(180deg,#25D366,#128C7E);
      color:#fff;
      border-color:#128C7E;
    }

    @media (min-width:760px){
      .panel{padding:22px;}
      .contacts{grid-template-columns:1fr 1fr;}
      .contact-card.tech{grid-column:1 / 3;}
    }

    @media (max-width:759px){
      main{
        padding-top:calc(var(--public-total-top, 150px) + 28px);
      }

      .panel-title{
        font-size:24px;
      }
    }
  </style>
