<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Animations - Les Vendredis du BT Suzini — Étape 3</title>

  <style>
    :root{
      --palm:#0b7a3b;
      --palm-dark:#064d28;
      --palm-light:#15a658;
      --navy:#06284a;
      --navy-dark:#03172b;
      --sun:#ffd21f;
      --sun-dark:#f3b800;
      --text:#17212b;
      --muted:#667085;
      --card:rgba(255,255,255,.95);
      --shadow:0 16px 40px rgba(16,24,40,.12);
      --container:1180px;
    }

    *{box-sizing:border-box;}

    html,body{
      max-width:100%;
      overflow-x:hidden;
    }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(255,210,31,.20), transparent 26%),
        radial-gradient(circle at 90% 8%, rgba(11,122,59,.16), transparent 26%),
        linear-gradient(180deg,#eaf9ff 0%,#fff4d4 52%,#ffffff 100%);
    }

    .container{
      width:min(var(--container), calc(100% - 28px));
      margin:0 auto;
    }

    main{
      padding-top:calc(var(--public-total-top, 158px) + 22px);
      padding-bottom:42px;
    }

    .panel{
      background:var(--card);
      border:1px solid rgba(255,255,255,.7);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:18px;
    }

    .panel-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      margin-bottom:14px;
    }

    .panel-title{
      margin:0;
      font-size:26px;
      line-height:1.05;
      letter-spacing:-.03em;
      color:var(--navy-dark);
    }

    .panel-text{
      margin:7px 0 0;
      color:var(--muted);
      font-size:15px;
      line-height:1.45;
    }

    .panel-tag{
      flex-shrink:0;
      padding:8px 12px;
      border-radius:999px;
      background:#e6f7ee;
      color:var(--palm-dark);
      font-size:12px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:14px;
    }

    .tab-btn{
      min-height:44px;
      border:none;
      border-radius:999px;
      background:#fff;
      color:var(--navy);
      font-size:14px;
      font-weight:1000;
      cursor:pointer;
      box-shadow:0 8px 16px rgba(16,24,40,.05);
      border:1px solid rgba(16,24,40,.10);
    }

    .tab-btn[aria-selected="true"]{
      background:linear-gradient(180deg,var(--sun),var(--sun-dark));
      color:var(--navy-dark);
      border-color:var(--sun-dark);
    }

    .tab-panel{
      display:none;
      margin-top:18px;
    }

    .tab-panel.active{
      display:block;
    }

    .affiche{
      width:100%;
      max-width:800px;
      margin:auto;
      border-radius:22px;
      overflow:hidden;
      background:#fff;
      border:1px solid rgba(16,24,40,.08);
      box-shadow:0 10px 24px rgba(16,24,40,.10);
    }

    .affiche img{
      display:block;
      width:100%;
      height:auto;
    }

    .content-card{
      background:#fff;
      border-radius:22px;
      border:1px solid rgba(16,24,40,.08);
      padding:22px;
      box-shadow:0 10px 24px rgba(16,24,40,.08);
    }

    .content-card h2{
      margin:0 0 14px;
      color:var(--navy-dark);
      font-size:24px;
    }

    .content-card p{
      margin:0 0 14px;
      line-height:1.7;
      color:#344054;
    }

    .highlight{
      margin-top:18px;
      padding:16px;
      border-radius:18px;
      background:linear-gradient(
        135deg,
        rgba(11,122,59,.08),
        rgba(255,210,31,.14)
      );
      border:1px solid rgba(11,122,59,.12);
      font-weight:800;
      color:var(--navy-dark);
    }

    @media (min-width:760px){
      .panel{
        padding:24px;
      }
    }

    @media (max-width:759px){
      .panel-title{
        font-size:24px;
      }

      main{
        padding-top:calc(var(--public-total-top, 150px) + 18px);
      }
    }
  </style>
