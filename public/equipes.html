<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Équipes — Les Vendredis du BT Suzini — Étape 3</title>

  <style>
    :root{
      --clay:#c65a1e;
      --clay-dark:#8e3a13;
      --clay-light:#ee8a3a;
      --sky:#27bced;
      --blue:#075b9a;
      --blue-dark:#063b72;
      --text:#17212b;
      --muted:#667085;
      --card:rgba(255,255,255,.94);
      --shadow:0 16px 40px rgba(16,24,40,.12);
      --container:1180px;
    }

    *{box-sizing:border-box;}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(39,188,237,.22), transparent 28%),
        radial-gradient(circle at 85% 10%, rgba(0,169,200,.16), transparent 26%),
        linear-gradient(180deg,#f4fcff 0%,#e9f8ff 48%,#fff 100%);
    }

    a{color:inherit;text-decoration:none;}

    .container{
      width:min(var(--container), calc(100% - 28px));
      margin:0 auto;
    }

    main{
      padding-top:calc(var(--public-total-top, 230px) + 18px);
      padding-bottom:42px;
    }

    .section{margin-top:12px;}

    .panel{
      background:var(--card);
      border:1px solid rgba(255,255,255,.6);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:16px;
    }

    .top-panel{
      padding:14px 16px;
    }

    .panel-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:10px;
    }

    .panel-title{
      margin:0;
      font-size:24px;
      line-height:1.05;
      letter-spacing:-.03em;
    }

    .panel-text{
      margin:5px 0 0;
      color:var(--muted);
      font-size:14px;
      line-height:1.3;
    }

    .panel-tag{
      flex-shrink:0;
      padding:7px 11px;
      border-radius:999px;
      background:#e4f7ff;
      color:var(--blue-dark);
      font-size:11px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .signup-box{
      margin-top:10px;
      padding:12px;
      border-radius:18px;
      background:linear-gradient(135deg,var(--clay),var(--clay-light));
      color:#fff;
      box-shadow:0 10px 22px rgba(198,90,30,.16);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .signup-box strong{
      display:block;
      font-size:16px;
      font-weight:1000;
      line-height:1.1;
    }

    .signup-box span{
      display:block;
      margin-top:2px;
      font-size:13px;
      line-height:1.25;
      opacity:.96;
    }

    .signup-btn{
      flex:0 0 auto;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:40px;
      padding:10px 13px;
      border-radius:999px;
      background:#fff;
      color:var(--clay-dark);
      font-weight:1000;
      font-size:13px;
      box-shadow:0 8px 16px rgba(0,0,0,.12);
      white-space:nowrap;
    }

    .summary-box{
      margin-top:10px;
      padding:11px 13px;
      border-radius:17px;
      background:linear-gradient(135deg,rgba(39,188,237,.12),rgba(198,90,30,.08));
      border:1px solid rgba(39,188,237,.22);
      color:#475467;
      font-size:14px;
      line-height:1.35;
    }

    .summary-box strong{
      color:var(--blue-dark);
      font-weight:1000;
    }

    .status-box{
      margin-top:10px;
      padding:10px 12px;
      border-radius:16px;
      background:#f8fcff;
      border:1px solid rgba(39,188,237,.18);
      color:#475467;
      font-size:13px;
      line-height:1.35;
    }

    .muted{color:var(--muted);}

    .teams-list{
      display:grid;
      gap:10px;
      margin-top:12px;
    }

    .team-card{
      border:1px solid rgba(16,24,40,.08);
      border-radius:18px;
      background:#fff;
      padding:12px;
      box-shadow:0 6px 16px rgba(0,0,0,.04);
      display:flex;
      gap:12px;
      justify-content:space-between;
      align-items:center;
      width:100%;
      min-width:0;
    }

    .team-left{
      min-width:0;
      flex:1 1 auto;
      display:flex;
      flex-direction:column;
      gap:5px;
    }

    .team-line1{
      display:flex;
      align-items:baseline;
      gap:8px;
      flex-wrap:wrap;
    }

    .team-num{
      color:#667085;
      font-variant-numeric:tabular-nums;
      font-weight:900;
    }

    .team-name{
      font-weight:1000;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      max-width:100%;
    }

    .team-line2,
    .team-line3{
      color:#222;
      font-weight:500;
      font-size:14px;
      line-height:1.25;
    }

    .ranked-rank{
      flex:0 0 auto;
      min-width:58px;
      min-height:58px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:linear-gradient(180deg,#e4f7ff,#c9f0ff);
      color:var(--blue-dark);
      border:1px solid rgba(39,188,237,.28);
      font-size:20px;
      font-weight:1000;
      box-shadow:0 6px 14px rgba(7,91,154,.08);
    }

    .pill{
      display:inline-block;
      padding:4px 9px;
      border-radius:999px;
      font-size:11px;
      border:1px solid #eee;
      background:#fafafa;
      color:#333;
      font-weight:1000;
      white-space:nowrap;
    }

    .pill.stby{
      border-color:#ffd37a;
      background:#fff7e6;
    }

    @media (min-width:760px){
      .panel{padding:20px;}
      .top-panel{padding:16px 20px;}
    }

    @media (max-width:759px){
      main{
        padding-top:calc(var(--public-total-top, 222px) + 14px);
      }

      .panel-title{font-size:22px;}

      .signup-box{
        align-items:flex-start;
      }

      .signup-btn{
        padding:10px 12px;
      }
    }
  </style>
<meta name="theme-color" content="#082d45"><meta name="description" content="Les Vendredis du BT Suzini, étape 3. Double dames et double hommes au TC Suzini le vendredi 6 novembre 2026."><link rel="manifest" href="../manifest.webmanifest?v=2"><link rel="stylesheet" href="../assets/site.css?v=11"><link rel="stylesheet" href="../assets/install.css?v=3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vendredis Suzini"><link rel="apple-touch-icon" href="../assets/img/vendredis-suzini-180-v2.png"></head>

<body data-space="public">

<div id="publicHeader"></div>

<main class="container">

  <section class="section">
    <div class="panel top-panel">
      <div class="panel-head">
        <div>
          <h1 class="panel-title">👥 Équipes inscrites</h1>
          <p class="panel-text">Les équipes engagées, par épreuve.</p>
        </div>
        <div class="panel-tag">Seniors</div>
      </div>

      <div class="signup-box">
        <div>
          <strong>Pas encore inscrit ?</strong>
          <span>Inscrivez votre équipe pour Les Vendredis du BT Suzini.</span>
        </div>
        <a class="signup-btn" href="inscriptions.html">📝 S’inscrire</a>
      </div>

      <div class="summary-box">
        <strong id="currentLabel">Double Messieurs</strong>
        <br>
        <span id="rankedCount">0</span> équipe(s) affichée(s)
      </div>

      <div class="status-box" id="status">Chargement des équipes…</div>
    </div>
  </section>

  <section class="section">
    <div class="panel">
      <div id="rankedList" class="teams-list"></div>
      <p class="muted" style="margin:10px 0 0;font-size:13px;">
        Les équipes apparaîtront ici après leur inscription.
      </p>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/public-header.js?v=11"></script>

</html>
