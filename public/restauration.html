<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restauration - Les Vendredis du BT Suzini — Étape 3</title>

  <style>
    :root{
      --palm:#0b7a3b;
      --palm-dark:#064d28;
      --palm-light:#15a658;
      --navy:#06284a;
      --navy-dark:#03172b;
      --sun:#ffd21f;
      --sun-dark:#f3b800;
      --sand:#fff4d4;
      --pink:#d83d7f;
      --text:#17212b;
      --muted:#667085;
      --card:rgba(255,255,255,.95);
      --shadow:0 16px 40px rgba(16,24,40,.12);
      --container:1180px;
    }

    *{box-sizing:border-box;}

    html,body{
      max-width:100%;
      overflow-x:hidden;
    }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(255,210,31,.20), transparent 26%),
        radial-gradient(circle at 90% 8%, rgba(11,122,59,.16), transparent 26%),
        linear-gradient(180deg,#eaf9ff 0%,#fff4d4 52%,#ffffff 100%);
    }

    a{color:inherit;text-decoration:none;}

    .container{
      width:min(var(--container), calc(100% - 28px));
      margin:0 auto;
    }

    main{
      padding-top:calc(var(--public-total-top, 158px) + 22px);
      padding-bottom:42px;
    }

    .section{margin-top:16px;}

    .panel{
      background:var(--card);
      border:1px solid rgba(255,255,255,.7);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:16px;
      min-width:0;
    }

    .panel-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      margin-bottom:14px;
    }

    .panel-title{
      margin:0;
      font-size:26px;
      line-height:1.05;
      letter-spacing:-.03em;
      color:var(--navy-dark);
    }

    .panel-text{
      margin:7px 0 0;
      color:var(--muted);
      font-size:15px;
      line-height:1.45;
    }

    .panel-tag{
      flex-shrink:0;
      padding:8px 12px;
      border-radius:999px;
      background:#e6f7ee;
      color:var(--palm-dark);
      font-size:12px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .tabs{
      display:grid;
      grid-template-columns:56px 56px 1fr;
      gap:8px;
      margin-top:14px;
      width:100%;
    }

    .tab-btn{
      min-height:44px;
      padding:10px 12px;
      border-radius:999px;
      border:1px solid rgba(16,24,40,.10);
      background:#fff;
      color:var(--navy);
      font-size:16px;
      font-weight:1000;
      cursor:pointer;
      box-shadow:0 8px 16px rgba(16,24,40,.05);
      min-width:0;
      white-space:nowrap;
    }

    .tab-btn.commande{font-size:14px;}

    .tab-btn[aria-selected="true"]{
      background:linear-gradient(180deg,var(--sun),var(--sun-dark));
      color:var(--navy-dark);
      border-color:var(--sun-dark);
    }

    .tab-panel{
      display:none;
      margin-top:16px;
      min-width:0;
    }

    .tab-panel.active{display:block;}

    .affiche{
      width:100%;
      max-width:720px;
      margin:0 auto;
      border-radius:22px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 10px 24px rgba(16,24,40,.10);
      border:1px solid rgba(16,24,40,.08);
    }

    .affiche img{
      display:block;
      width:100%;
      height:auto;
    }

    .subtabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-bottom:14px;
    }

    .subtab-btn{
      min-height:42px;
      padding:9px 10px;
      border-radius:999px;
      border:1px solid rgba(16,24,40,.10);
      background:linear-gradient(180deg,var(--sun),var(--sun-dark));
      color:var(--navy-dark);
      font-weight:1000;
      cursor:pointer;
      font-size:14px;
      min-width:0;
      opacity:.82;
    }

    .subtab-btn[aria-selected="true"]{
      opacity:1;
      box-shadow:0 10px 20px rgba(255,210,31,.20);
    }

    .subtab-panel{display:none;}
    .subtab-panel.active{display:block;}

    .closed-box,
    .edit-box,
    .token-box{
      margin-bottom:14px;
      padding:14px 16px;
      border-radius:18px;
      font-size:15px;
      font-weight:900;
      line-height:1.45;
    }

    .closed-box{
      display:none;
      background:#fff7e6;
      border:1px solid #ffd37a;
      color:#9a5b00;
    }

    .closed-box.show{display:block;}

    .edit-box{
      display:none;
      background:#e6f7ee;
      border:1px solid rgba(11,122,59,.22);
      color:var(--palm-dark);
    }

    .edit-box.show{display:block;}

    .token-box{
      display:none;
      background:#f8fafc;
      border:1px solid rgba(16,24,40,.10);
      color:#344054;
      word-break:break-word;
    }

    .token-box.show{display:block;}

    .token-link{
      display:block;
      margin-top:8px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(16,24,40,.08);
      color:var(--navy-dark);
      font-size:13px;
      font-weight:900;
      word-break:break-all;
    }

    .copy-btn{
      margin-top:10px;
      min-height:44px;
      border:none;
      border-radius:14px;
      background:linear-gradient(180deg,var(--sun),var(--sun-dark));
      color:var(--navy-dark);
      font-weight:1000;
      padding:10px 12px;
      cursor:pointer;
      width:100%;
    }

    .form{
      display:grid;
      gap:14px;
      min-width:0;
    }

    .form.disabled{
      opacity:.55;
      pointer-events:none;
    }

    .field{
      display:grid;
      gap:8px;
      min-width:0;
    }

    .field label{
      font-weight:1000;
      color:#1c2430;
    }

    input{
      width:100%;
      min-width:0;
      min-height:52px;
      border-radius:16px;
      border:1px solid rgba(16,24,40,.12);
      background:#fff;
      padding:0 14px;
      font-size:16px;
      color:#17212b;
      outline:none;
      font-family:inherit;
    }

    input:focus{
      border-color:rgba(11,122,59,.50);
      box-shadow:0 0 0 4px rgba(11,122,59,.10);
    }

    .choice-card{
      border-radius:20px;
      background:#fff;
      border:1px solid rgba(16,24,40,.08);
      padding:14px;
      display:grid;
      gap:12px;
      box-shadow:0 8px 18px rgba(16,24,40,.05);
      min-width:0;
    }

    .choice-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      min-width:0;
    }

    .choice-name{
      font-size:18px;
      font-weight:1000;
      color:var(--navy-dark);
      word-break:break-word;
    }

    .choice-price{
      flex-shrink:0;
      padding:6px 10px;
      border-radius:999px;
      background:var(--sand);
      color:var(--palm-dark);
      font-weight:1000;
      font-size:13px;
    }

    .qty-control{
      display:grid;
      grid-template-columns:48px 1fr 48px;
      gap:8px;
      align-items:center;
      width:100%;
    }

    .qty-btn{
      height:48px;
      border:none;
      border-radius:16px;
      background:linear-gradient(180deg,var(--sun),var(--sun-dark));
      color:var(--navy-dark);
      font-size:24px;
      font-weight:1000;
      cursor:pointer;
      box-shadow:0 8px 16px rgba(255,210,31,.18);
    }

    .qty-value{
      height:48px;
      border-radius:16px;
      background:#f8fafc;
      border:1px solid rgba(16,24,40,.08);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      font-weight:1000;
      color:var(--navy-dark);
    }

    .total-box{
      padding:14px 16px;
      border-radius:18px;
      background:linear-gradient(135deg,rgba(11,122,59,.10),rgba(255,210,31,.16));
      border:1px solid rgba(11,122,59,.18);
      color:#475467;
      font-size:15px;
      line-height:1.45;
    }

    .total-box strong{
      color:var(--navy-dark);
      font-size:20px;
    }

    .btn{
      appearance:none;
      border:none;
      min-height:56px;
      border-radius:18px;
      padding:14px 18px;
      font-size:16px;
      font-weight:1000;
      cursor:pointer;
      font-family:inherit;
      width:100%;
    }

    .btn-primary{
      background:linear-gradient(180deg,var(--sun),var(--sun-dark));
      color:var(--navy-dark);
      box-shadow:0 12px 22px rgba(255,210,31,.22);
    }

    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .status{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.45;
      font-weight:800;
    }

    .orders-list{
      display:grid;
      gap:10px;
      min-width:0;
    }

    .order-card{
      border-radius:18px;
      background:#fff;
      border:1px solid rgba(16,24,40,.08);
      padding:13px;
      box-shadow:0 6px 16px rgba(16,24,40,.04);
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      align-items:center;
      min-width:0;
    }

    .order-name{
      font-size:18px;
      font-weight:1000;
      color:var(--navy-dark);
      word-break:break-word;
    }

    .order-detail{
      color:#344054;
      font-size:14px;
      line-height:1.35;
      font-weight:800;
      word-break:break-word;
    }

    .order-total{
      margin-top:3px;
      color:var(--palm-dark);
      font-weight:1000;
    }

    .payment-dot{
      width:38px;
      height:38px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      font-weight:1000;
      color:#fff;
      box-shadow:0 8px 16px rgba(16,24,40,.10);
      flex-shrink:0;
    }

    .payment-dot.paid{background:#087a35;}
    .payment-dot.unpaid{background:#b42318;}

    .muted{
      color:var(--muted);
      font-size:14px;
      line-height:1.45;
    }

    @media (min-width:760px){
      .panel{padding:24px;}
      .form-grid{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:12px;
      }
    }

    @media (max-width:759px){
      main{
        padding-top:calc(var(--public-total-top, 150px) + 18px);
      }

      .panel-title{font-size:24px;}
      .panel-head{align-items:flex-start;}
    }
  </style>
